name: Validate Plugins

on:
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'tools/**'
      - 'hooks/**'
      - 'adapters/**'
      - 'marketplace.yaml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/**'
      - '.github/workflows/validate-plugins.yml'
  pull_request:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'skills/**'
      - 'tools/**'
      - 'hooks/**'
      - 'adapters/**'
      - 'marketplace.yaml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/**'
      - '.github/workflows/validate-plugins.yml'

jobs:
  # plugins/ and .claude-plugin/ are generated by adapters/claude/build.py from
  # the neutral sources (marketplace.yaml, skills/, tools/, hooks/). Rebuild and
  # fail if the committed output drifts from them.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Rebuild Claude output from neutral sources
        run: python3 adapters/claude/build.py

      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain -- plugins .claude-plugin CLAUDE.md)" ]; then
            echo "Generated output is out of date. Run: python3 adapters/claude/build.py"
            git status --porcelain -- plugins .claude-plugin CLAUDE.md
            git --no-pager diff -- plugins .claude-plugin CLAUDE.md | head -200
            exit 1
          fi

      - name: Smoke-test hook scripts and Claude shim
        run: bash scripts/test-hook-scripts.sh

  validate:
    runs-on: ubuntu-latest
    if: vars.ENABLE_PLUGIN_CI == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugins
        run: bash scripts/validate-plugins.sh
