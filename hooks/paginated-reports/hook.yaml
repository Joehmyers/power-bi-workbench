# Platform-neutral hook definition. Events describe when to run each script;
# adapters translate them into platform wiring (see adapters/README.md).
#
# Deliberately not wired to shell commands: a post-command hook cannot tell
# whether a command wrote or merely read a .rdl, so it would block reads and
# cleanup. Validate a command-created .rdl by running the script directly.
name: paginated-reports
description: Validates paginated report (.rdl) structure with validate_rdl.py after Write/Edit modifications
events:
  - event: file-change
    paths: "**/*.rdl"
    extensions: [rdl]
    run: validate-rdl.sh
    timeout: 10
